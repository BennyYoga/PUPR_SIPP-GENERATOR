<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popup Extension</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Logo dan Info -->
    <div class="card mb-4">
      <div class="row my-2">
        <div class="col-2 d-flex justify-content-end align-items-center">
          <img src="./images/logo-64.png" alt="Logo" class="logo" />
        </div>
        <div class="col-10">
          <div class="app-name">SIPP-Generated</div>
          <div class="description">Ekstensi untuk melakukan generate Excel pada SIPP</div>
        </div>
      </div>
    </div>

    <!-- Data Panel -->
    <div class="table-container">
      <table class="table table-striped table-bordered">
        <thead class="table-light">
          <tr>
            <th scope="col">Data</th>
            <th scope="col">Data Diambil</th>
            <th scope="col">Status</th>
            <th scope="col">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Rencana Keuangan</td>
            <td id="waktuKeuangan">-</td>
            <td id="statusKeuangan">Belum Diambil</td>
            <td>
              <button id="rencanaKeuangan" class="btn btn-success btn-sm btn-table">Ambil</button>
            </td>
          </tr>
          <tr>
            <td>Rencana Fisik</td>
            <td id="waktuFisik">-</td>
            <td id="statusFisik">Belum Diambil</td>
            <td>
              <button id="rencanaFisik" class="btn btn-success btn-sm btn-table">Ambil</button>
            </td>
          </tr>
          <tr>
            <td>SIPP</td>
            <td id="waktuSIPP">-</td>
            <td id="statusSIPP">Belum Diambil</td>
            <td>
              <button id="SIPP" class="btn btn-success btn-sm btn-table">Ambil</button>
            </td>
          </tr>
          <tr>
            <td>Progress Satker</td>
            <td id="waktuSatker">-</td>
            <td id="statusSatker">Belum Diambil</td>
            <td>
              <button id="satker" class="btn btn-success btn-sm btn-table">Ambil</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Main Content -->
    <div class="mt-1">
      <div class="d-flex flex-column gap-2">
        <button id="excelPage" class="btn btn-success">Generate Excel</button>
        <button id="pdfPage" class="btn btn-danger">Generate PDF</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer mt-2">Created by Benny Yoga</div>

    <script src="js/generate-data-main.js" defer></script>
    <script src="js/generate-data-rencana.js" defer></script>
    <script src="js/generate-excel.js" defer></script>
    <script src="js/generate-pdf.js" defer></script>
    <!-- <script src="js/xlsx.full.min.js"></script> -->
    <script src="js/pdfjs.min.js"></script>
    <script src="js/exceljs.min.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
